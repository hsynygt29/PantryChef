<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Burger Master - Sipariş Oyunu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>🍔 Burger Master</h1>
    <p>Müşterinin istediği malzemeleri sırasıyla ekle ve hamburgeri tamamla!</p>
  </header>

  <main class="container">
    <!-- Skor ve Müşteri Sipariş Alanı -->
    <section class="order-section">
      <div class="stats-bar">
        <div>Skor: <span id="score">0</span></div>
        <div>Kalan Süre: <span id="timer">30</span>s</div>
      </div>

      <div class="customer-box">
        <h2>Müşterinin Siparişi:</h2>
        <div id="targetOrder" class="target-ingredients">
          <!-- Hedef malzemeler burada görünecek -->
        </div>
      </div>
    </section>

    <!-- Oyun Alanı: Tabağımız ve Malzeme Butonları -->
    <section class="game-section">
      <div class="plate-area">
        <h3>Senin Tabağın</h3>
        <div id="burgerPlate" class="burger-plate">
          <!-- Koyduğun malzemeler üst üste binecek -->
        </div>
      </div>

      <div class="controls">
        <h3>Malzemeler</h3>
        <div class="ingredient-buttons">
          <button onclick="addIngredient('🍞 Alt Ekmek')">🍞 Alt Ekmek</button>
          <button onclick="addIngredient('🥩 Köfte')">🥩 Köfte</button>
          <button onclick="addIngredient('🧀 Peynir')">🧀 Peynir</button>
          <button onclick="addIngredient('🥬 Marul')">🥬 Marul</button>
          <button onclick="addIngredient('🍅 Domates')">🍅 Domates</button>
          <button onclick="addIngredient('🍞 Üst Ekmek')">🍞 Üst Ekmek</button>
        </div>

        <div class="action-buttons">
          <button id="submitBtn" onclick="checkBurger()" class="btn-submit">Servis Et 🔔</button>
          <button onclick="resetPlate()" class="btn-reset">Tabağı Temizle 🗑️</button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
<link rel="manifest" href="manifest.json">
